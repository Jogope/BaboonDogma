<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dominus Manager | Roman Gladiator Tactical Management Simulation</title>
  
  <!-- Metadatos para compartir en redes (Discord, X, WhatsApp) -->
  <meta name="description" content="Authentic Roman gladiator school management simulation for PC. Build your ludus, master deep tactical combat, and dominate the Colosseum.">
  <meta property="og:title" content="Dominus Manager | Official Website">
  <meta property="og:description" content="Take command of the ludus. Stat-driven tactical gladiator combat on PC.">
  <meta property="og:image" content="logo-game.png">
  <meta property="og:url" content="https://baboondogma.com">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #070709;
      --card-bg: rgba(16, 16, 22, 0.88);
      --border: rgba(212, 175, 55, 0.32);
      --border-bright: rgba(245, 215, 127, 0.7);
      --gold: #d4af37;
      --gold-light: #f5d77f;
      --gold-glow: rgba(212, 175, 55, 0.3);
      --crimson: #8b181d;
      --text: #d8dbe0;
      --text-muted: #9ba1ad;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(139, 24, 29, 0.22) 0%, rgba(212, 175, 55, 0.08) 35%, transparent 70%),
        radial-gradient(circle at 50% 85%, rgba(212, 175, 55, 0.05) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
      position: relative;
    }

    #embers-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* Cabecera */
    header {
      padding: 28px 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-logo {
      height: 62px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.8));
      transition: transform 0.2s ease;
    }

    .header-logo:hover {
      transform: scale(1.04);
    }

    .lang-switcher {
      display: flex;
      gap: 6px;
      background: rgba(20, 20, 28, 0.7);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 14px;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--gold);
      color: #050507;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 30px 0 20px;
    }

    .game-logo {
      max-width: 580px;
      width: 92%;
      height: auto;
      margin: 0 auto 18px;
      display: block;
      filter: drop-shadow(0 0 40px rgba(212, 175, 55, 0.35));
    }

    .hero-subtitle {
      font-family: 'Cinzel', serif;
      color: var(--gold-light);
      font-size: 1.15rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      max-width: 900px;
      margin: 0 auto 35px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      text-wrap: balance;
    }

    /* Tráiler Cinematográfico */
    .trailer-wrapper {
      max-width: 920px;
      margin: 0 auto 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f1015;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.95), 0 0 45px rgba(212, 175, 55, 0.12);
      overflow: hidden;
      position: relative;
    }

    .trailer-header {
      background: linear-gradient(180deg, #1c1d26 0%, #12131a 100%);
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
    }

    .trailer-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gold-light);
      font-weight: 700;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff2a2a;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff2a2a;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    .trailer-badge {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
    }

    .video-frame {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background: #000;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Botón Steam */
    .cta-area {
      text-align: center;
      margin-bottom: 70px;
    }

    .btn-steam {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, #161a22 0%, #223247 100%);
      color: #fff;
      text-decoration: none;
      padding: 18px 46px;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      border: 1px solid var(--gold);
      box-shadow: 0 12px 30px rgba(0,0,0,0.8), 0 0 25px rgba(212, 175, 55, 0.25);
      transition: all 0.3s ease;
      position: relative;
    }

    .btn-steam:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--border-bright);
      box-shadow: 0 18px 45px rgba(0,0,0,0.9), 0 0 40px rgba(212, 175, 55, 0.45);
    }

    /* Divisor Ornamental */
    .roman-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 60px auto;
      max-width: 600px;
    }

    .roman-divider::before, .roman-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .divider-diamond {
      width: 10px;
      height: 10px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    /* Cabeceras de Sección */
    .section-eyebrow {
      font-family: 'Cinzel', serif;
      color: var(--gold);
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 10px;
    }

    .section-heading {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      color: #fff;
      text-align: center;
      margin-bottom: 45px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.8);
    }

    /* Características (Cuadrícula 3x2) */
    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 30px 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 14px;
      height: 14px;
      border-top: 2px solid var(--gold);
      border-left: 2px solid var(--gold);
    }

    .feature-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 14px;
      height: 14px;
      border-bottom: 2px solid var(--gold);
      border-right: 2px solid var(--gold);
    }

    .feature-card:hover {
      border-color: var(--border-bright);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 25px rgba(212, 175, 55, 0.15);
    }

    .feature-num {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .feature-card h3 {
      font-family: 'Cinzel', serif;
      color: #fff;
      font-size: 1.25rem;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .feature-card p {
      font-size: 0.94rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Galería de Capturas (Cuadrícula 3x2) */
    .screenshots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .shot-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0d0e14;
      aspect-ratio: 16 / 9;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
    }

    .shot-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 14px;
      height: 14px;
      border-top: 2px solid var(--gold);
      border-left: 2px solid var(--gold);
      z-index: 2;
    }

    .shot-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 14px;
      height: 14px;
      border-bottom: 2px solid var(--gold);
      border-right: 2px solid var(--gold);
      z-index: 2;
    }

    .shot-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .shot-card:hover {
      border-color: var(--border-bright);
      transform: translateY(-4px);
      box-shadow: 0 16px 45px rgba(0,0,0,0.8), 0 0 30px rgba(212, 175, 55, 0.2);
    }

    .shot-card:hover img {
      transform: scale(1.05);
      filter: brightness(1.08);
    }

    .shot-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 55%, rgba(7, 7, 9, 0.9) 100%);
      display: flex;
      align-items: flex-end;
      padding: 12px 14px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    .shot-card:hover .shot-overlay {
      opacity: 1;
    }

    .shot-caption {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.8px;
      color: var(--gold-light);
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      line-height: 1.2;
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 6, 0.94);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 24px;
      cursor: zoom-out;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 8px;
      border: 1px solid var(--gold);
      box-shadow: 0 20px 60px rgba(0,0,0,0.95), 0 0 50px rgba(212, 175, 55, 0.3);
      cursor: default;
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 32px;
      color: var(--gold-light);
      font-size: 2.4rem;
      font-weight: 300;
      cursor: pointer;
      line-height: 1;
      transition: transform 0.2s;
    }

    .lightbox-close:hover {
      transform: scale(1.2);
      color: #fff;
    }

    /* Estudio */
    .studio-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 50px 36px 40px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .studio-logo-inner {
      height: 90px;
      width: auto;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
    }

    .studio-card p {
      max-width: 720px;
      margin: 0 auto 36px;
      font-size: 1.1rem;
      color: var(--text);
      line-height: 1.7;
    }

    .badges {
      display: flex;
      justify-content: center;
      gap: 50px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 30px;
    }

    .badge-item strong {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      color: var(--gold-light);
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .badge-item span {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    /* Contacto */
    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 38px;
      text-align: center;
      margin-bottom: 70px;
    }

    .email-box {
      display: inline-flex;
      align-items: center;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 22px;
      margin-top: 18px;
      gap: 16px;
    }

    .email-box span {
      font-family: monospace;
      color: var(--gold-light);
      font-size: 1.05rem;
    }

    .btn-copy {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .btn-copy:hover {
      background: var(--gold);
      color: #050507;
      box-shadow: 0 0 12px var(--gold-glow);
    }

    /* Footer */
    footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 35px 0 45px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .footer-icons {
      display: flex;
      gap: 22px;
    }

    .footer-icons a {
      color: var(--text-muted);
      transition: all 0.2s;
      display: flex;
      align-items: center;
    }

    .footer-icons a:hover {
      color: var(--gold);
      transform: translateY(-2px);
    }

    @media (max-width: 992px) {
      .features-grid { grid-template-columns: repeat(2, 1fr); }
      .screenshots-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .features-grid { grid-template-columns: 1fr; }
      .screenshots-grid { grid-template-columns: 1fr; }
      .badges { flex-direction: column; gap: 20px; }
      footer { flex-direction: column; gap: 18px; text-align: center; }
      .header-logo { height: 48px; }
      .game-logo { max-width: 420px; }
      .email-box { flex-direction: column; width: 100%; }
    }
  </style>
</head>
<body>

  <canvas id="embers-canvas"></canvas>

  <div class="container">
    <!-- Header -->
    <header>
      <img src="logo-studio.png" alt="Baboon Dogma" class="header-logo" onerror="this.style.display='none'">
      <div class="lang-switcher">
        <button class="lang-btn" onclick="setLanguage('es')">ES</button>
        <button class="lang-btn active" onclick="setLanguage('en')">EN</button>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero">
      <img src="logo-game.png" alt="Dominus Manager" class="game-logo" onerror="this.outerHTML='<h1 style=\'font-family:Cinzel;color:var(--gold);font-size:2.8rem;margin-bottom:15px;\'>DOMINUS MANAGER</h1>'">
      <p class="hero-subtitle" data-i18n="hero-sub">A Roman gladiator tactical management simulation for PC</p>
    </section>

    <!-- Tráiler Oficial -->
    <div class="trailer-wrapper">
      <div class="trailer-header">
        <div class="trailer-title">
          <span class="live-dot"></span>
          <span data-i18n="trailer-bar">DOMINUS MANAGER — OFFICIAL REVEAL</span>
        </div>
        <div class="trailer-badge">4K 60FPS</div>
      </div>
      <div class="video-frame">
        <iframe 
          src="https://www.youtube.com/embed/JTa1_sTM0Nk?rel=0&modestbranding=1" 
          title="Dominus Manager Official Reveal Trailer" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- CTA Steam Principal -->
    <div class="cta-area">
      <a href="https://store.steampowered.com/app/4743280/Dominus_Manager/" target="_blank" class="btn-steam">
